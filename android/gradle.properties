org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Homebrew JDKs are not on Gradle's auto-detection path on macOS, so point the
# toolchain resolver at them explicitly (JDK 21 is what AGP compiles against).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21,/opt/homebrew/opt/openjdk

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
