[versions]
# Queried from the registries on 2026-09-10 (see CLAUDE.md "Stack Policy"):
# https://services.gradle.org/versions/current, Google Maven, Maven Central.
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
junit = "6.1.3"
# Test-only JSON reader for the shared fixtures in ../fixtures.
json = "20260814"
# Test-only Android runtime for the `spanned()` unit test.
robolectric = "4.16.1"
junit4 = "4.13.2"
# Android SDK levels
compileSdk = "37"
minSdk = "24"
# JDK the Kotlin/Android toolchains compile against. AGP does not accept a
# JVM target above 21, so the toolchain is pinned to 21 even though the
# Gradle daemon itself may run on a newer local JDK.
jdk = "21"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# Versions come from the Compose BOM above.
androidx-compose-ui-text = { module = "androidx.compose.ui:ui-text" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
