name: Release

# Manual trigger only, like ci.yml. Push the version tag first, then:
#   gh workflow run release.yml -f tag=vX.Y.Z
# Publishing jobs skip versions that already exist, so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-rc.1); must already exist"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - id: v
        name: Check every port carries the tagged version
        run: |
          set -eu
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # PEP 440 spelling of the same version: 0.1.0-rc.1 -> 0.1.0rc1
          pyversion="$(printf '%s' "$version" | sed -E 's/-(alpha|beta|rc)\.?/\1/; s/alpha/a/; s/beta/b/')"
          fail=0
          check() { grep -qF "$2" "$1" || { echo "::error file=$1::expected '$2'"; fail=1; }; }
          check packages/core/package.json "\"version\": \"$version\""
          check android/build.gradle.kts "version = \"$version\""
          check python/pyproject.toml "version = \"$pyversion\""
          check python/smooth_reading/__init__.py "__version__ = \"$pyversion\""
          check CHANGELOG.md "## $version"
          exit $fail

  npm:
    name: npm (@smooth-reading/core)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN not set, skipping npm publish"
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - if: env.NPM_TOKEN != ''
        uses: pnpm/action-setup@v6
      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: env.NPM_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.NPM_TOKEN != ''
        run: pnpm build && pnpm typecheck && pnpm test && pnpm pack:check
      - if: env.NPM_TOKEN != ''
        name: Publish
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          tag=latest
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && tag=next
          pnpm publish --access public --no-git-checks --tag "$tag"

  pypi:
    name: PyPI (smooth-reading)
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m mypy --strict smooth_reading
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: python/dist
          print-hash: true

  maven-central:
    name: Maven Central (io.smoothreading)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
    steps:
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername == ''
        run: echo "::warning::MAVEN_CENTRAL_USERNAME not set, skipping Maven Central publish"
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        uses: gradle/actions/setup-gradle@v6
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        run: ./gradlew test --console=plain
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        name: Publish and release on the Central Portal
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain

  github-release:
    name: GitHub release (SwiftPM)
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Swift package resolves and tests at this tag
        working-directory: swift
        run: swift build && swift test
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 0
          fi
          # Changelog section for this version, up to the next "## " heading.
          awk -v v="## $VERSION" '
            $0 ~ "^## " { if (found) exit; if (index($0, v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $flags
