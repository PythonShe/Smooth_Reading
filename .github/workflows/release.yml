name: Release

# Manual trigger only, like ci.yml. Push the version tag first, then:
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z
# `--ref` matters for pub.dev: its automated publishing checks that the
# workflow ran on a tag matching the configured pattern (`v{{version}}`).
# Publishing jobs skip versions that already exist, so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-rc.1); must already exist"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - id: v
        name: Check every port carries the tagged version
        run: |
          set -eu
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # PEP 440 spelling of the same version: 0.1.0-rc.1 -> 0.1.0rc1
          pyversion="$(printf '%s' "$version" | sed -E 's/-(alpha|beta|rc)\.?/\1/; s/alpha/a/; s/beta/b/')"
          fail=0
          check() { grep -qF "$2" "$1" || { echo "::error file=$1::expected '$2'"; fail=1; }; }
          check packages/core/package.json "\"version\": \"$version\""
          check android/build.gradle.kts "version = \"$version\""
          check python/pyproject.toml "version = \"$pyversion\""
          check python/smooth_reading/__init__.py "__version__ = \"$pyversion\""
          check dart/pubspec.yaml "version: $version"
          check dart/lib/src/version.dart "packageVersion = '$version'"
          check rust/Cargo.toml "version = \"$version\""
          check CHANGELOG.md "## $version"
          exit $fail

  npm:
    name: npm (@smooth-reading/core)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance attestation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm test && pnpm pack:check
      - name: Publish
        working-directory: packages/core
        # No NPM_TOKEN: the package's trusted publisher on npmjs.com is this
        # repository + release.yml, so pnpm exchanges the GitHub OIDC token
        # for a short-lived publish token at publish time.
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          if npm view "@smooth-reading/core@$version" version >/dev/null 2>&1; then
            echo "@smooth-reading/core@$version is already on npm, skipping"; exit 0
          fi
          tag=latest
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && tag=next
          pnpm publish --access public --no-git-checks --tag "$tag"

  pypi:
    name: PyPI (smooth-reading)
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m mypy --strict smooth_reading
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: python/dist
          print-hash: true
          skip-existing: true

  pub:
    name: pub.dev (smooth_reading)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev automated publishing (OIDC)
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # The first version of a package cannot be published from CI (the owner
      # runs `dart pub publish` once, then enables automated publishing in the
      # package Admin tab). Until then pub.dev rejects the OIDC token even for
      # `pub get`, so the job decides first and only then sets up Dart.
      - id: check
        name: Is this version missing from pub.dev?
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          if ! curl -fsS "https://pub.dev/api/packages/smooth_reading" >/dev/null 2>&1; then
            echo "::warning::smooth_reading is not on pub.dev yet; publish the first version manually. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif curl -fsS "https://pub.dev/api/packages/smooth_reading/versions/$version" >/dev/null 2>&1; then
            echo "smooth_reading $version is already on pub.dev, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # setup-dart registers the OIDC-exchanged PUB_TOKEN as a pub credential.
      # Drop that credential for the read-only steps (with it registered, pub
      # sends it on every pub.dev request, and a missing variable is an error)
      # and register it again only for the publish itself.
      - if: steps.check.outputs.publish == 'true'
        run: |
          dart pub token remove https://pub.dev
          dart pub get && dart analyze --fatal-infos && dart test
      - if: steps.check.outputs.publish == 'true'
        name: Publish
        run: |
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          dart pub publish --force

  crates-io:
    name: crates.io (smooth-reading)
    needs: verify
    runs-on: ubuntu-latest
    # A scoped API token for now; crates.io trusted publishing (OIDC via
    # rust-lang/crates-io-auth-action) can only be configured once the first
    # version exists, so switch after 0.3.0 like pub.dev.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    defaults:
      run:
        working-directory: rust
    steps:
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Lints are gated in ci.yml; a new clippy lint on release day must not
      # block crates.io while the other registries ship.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo test --locked
      - if: env.CARGO_REGISTRY_TOKEN != ''
        name: Publish
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          if curl -fsS -A "smooth-reading-release (github actions)" \
               "https://crates.io/api/v1/crates/smooth-reading/$version" >/dev/null 2>&1; then
            echo "smooth-reading $version is already on crates.io, skipping"; exit 0
          fi
          cargo publish --locked

  maven-central:
    name: Maven Central (io.github.pythonshe)
    needs: verify
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
    steps:
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername == ''
        run: echo "::warning::MAVEN_CENTRAL_USERNAME not set, skipping Maven Central publish"
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        uses: gradle/actions/setup-gradle@v6
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        working-directory: android
        run: ./gradlew test --console=plain
      - if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        name: Publish and release on the Central Portal
        working-directory: android
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain

  github-release:
    name: GitHub release (SwiftPM)
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Swift package resolves and tests at this tag
        working-directory: swift
        run: swift build && swift test
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 0
          fi
          # Changelog section for this version, up to the next "## " heading.
          awk -v v="## $VERSION" '
            $0 ~ "^## " { if (found) exit; if (index($0, v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $flags
